services:
  db:
    image: postgres:16-alpine
    container_name: tsetmc-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me}
      POSTGRES_DB: ${DB_NAME:-tsetmc_options}
    ports:
      - "${DB_PORT:-5440}:5432"
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-tsetmc_options}"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 2s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tsetmc-backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_PORT: 8080
      APP_ALLOWED_ORIGINS: ${APP_ALLOWED_ORIGINS:-http://localhost:3080,http://127.0.0.1:3080,http://localhost:3000,http://127.0.0.1:3000}
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-change_me}
      DB_NAME: ${DB_NAME:-tsetmc_options}
    ports:
      - "${APP_PORT:-8085}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider http://127.0.0.1:8080/api/v1/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tsetmc-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3080}:80"
    depends_on:
      backend:
        condition: service_healthy

  crawler:
    build:
      context: ./crawler
      dockerfile: Dockerfile
    container_name: tsetmc-crawler
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-change_me}
      DB_NAME: ${DB_NAME:-tsetmc_options}
      CRAWLER_BASE_URL: ${CRAWLER_BASE_URL:-https://cdn.tsetmc.com/api}
      CRAWLER_RATE_LIMIT_SECONDS: ${CRAWLER_RATE_LIMIT_SECONDS:-3.0}
      CRAWLER_MAX_RETRIES: ${CRAWLER_MAX_RETRIES:-3}
      CRAWLER_BACKOFF_FACTOR: ${CRAWLER_BACKOFF_FACTOR:-1.0}
      CRAWLER_USER_AGENT: ${CRAWLER_USER_AGENT:-tsetmc-options-platform/0.1 (student project; optick-lab)}
      CRAWLER_REQUEST_TIMEOUT: ${CRAWLER_REQUEST_TIMEOUT:-10.0}
      CRAWLER_QUIET_HOURS_START: ${CRAWLER_QUIET_HOURS_START:-09:00}
      CRAWLER_QUIET_HOURS_END: ${CRAWLER_QUIET_HOURS_END:-12:30}
      CRAWLER_QUIET_HOURS_TZ: ${CRAWLER_QUIET_HOURS_TZ:-Asia/Tehran}
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "crawler", "--help"]

volumes:
  pgdata:
